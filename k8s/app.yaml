apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraprep
  namespace: terraform-learning
spec:
  replicas: 1
  minReadySeconds: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: terraprep
  template:
    metadata:
      labels:
        app: terraprep
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.28.0-alpine
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: assets
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: temp
              mountPath: /tmp
      volumes:
        - name: assets
          configMap:
            name: terraprep-assets
        - name: config
          configMap:
            name: terraprep-nginx
        - name: temp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: terraprep
  namespace: terraform-learning
spec:
  type: ClusterIP
  selector:
    app: terraprep
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: terraprep
  namespace: terraform-learning
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - tf-004.thwin.net
      secretName: cloudflare-origin-tls
  rules:
    - host: tf-004.thwin.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: terraprep
                port:
                  name: http
